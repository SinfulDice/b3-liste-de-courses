# Configuration de nginx dans le conteneur (remplace celle par défaut de l'image).
server {
    # R24 : port 8080, car un utilisateur non-root ne peut pas écouter sur le port 80.
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # R37 + R56 : les pages (/, /liste) n'existent pas en tant que fichiers : c'est React Router qui
    # les affiche. "try_files" cherche d'abord un vrai fichier (ex : /favicon.svg), sinon un dossier,
    # et sinon renvoie index.html : l'app démarre et React Router affiche la bonne page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html ne doit pas rester en cache : sinon, après un déploiement, le navigateur
    # garderait l'ancienne version de l'app.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Les fichiers de dist/assets ont un nom qui change à chaque build (index-AbC123.js) :
    # on peut les garder en cache longtemps sans risque.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
